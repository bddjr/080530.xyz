<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="生日倒计时图标">
  <title>生日倒计时</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#0f2a44"/>
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe884"/>
      <stop offset="1" stop-color="#ffbe3d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1c9"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.55" stop-color="#ffbe3d"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 蛋糕主体 -->
  <rect x="16" y="38" width="32" height="16" rx="4" fill="url(#cake)"/>

  <!-- 奶油层（波浪顶边） -->
  <path d="M16 40 L16 34 Q20 29 24 34 Q28 29 32 34 Q36 29 40 34 Q44 29 48 34 L48 40 Z"
        fill="url(#cream)"/>

  <!-- 蜡烛 -->
  <rect x="30" y="20" width="4" height="14" rx="2" fill="#ff8fa3"/>
  <rect x="30" y="20" width="1.6" height="14" rx="0.8" fill="#ffb3c6" opacity="0.8"/>

  <!-- 火焰 -->
  <path d="M32 9 C36 14 36 18 32 20 C28 18 28 14 32 9 Z" fill="url(#flame)"/>

  <!-- 糖针装饰 -->
  <circle cx="22" cy="45" r="1.6" fill="#ff6b6b"/>
  <circle cx="32" cy="47" r="1.6" fill="#6f8dff"/>
  <circle cx="42" cy="45" r="1.6" fill="#3ddc97"/>
  <circle cx="27" cy="50" r="1.3" fill="#ffbe3d"/>
  <circle cx="37" cy="50" r="1.3" fill="#ff8fa3"/>
</svg>